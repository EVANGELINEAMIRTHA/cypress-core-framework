# Project identification
sonar.projectKey=cypress-rockwell-project
sonar.projectName=Cypress Rockwell Project
sonar.projectVersion=1.0

# Path to source code
sonar.sources=cypress

# Language setting
sonar.language=js

# Exclude unnecessary files from analysis
# We exclude node_modules, reports, and binary snapshots to keep analysis fast
sonar.exclusions=**/node_modules/**,**/snapshots/**,**/allure-report/**,**/allure-results/**,**/screenshots/**

# If you configure code coverage later, uncomment these:
# sonar.javascript.lcov.reportPaths=coverage/lcov.info